[package]
name = "sally"
version = "0.1.0"
edition = "2021"

[profile.profiling]
inherits = "release"
debug = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.10.3"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
pest = "2.9.4"
pest_derive = "2.9.4"
lazy_static = "1.5.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand_distr = "0.6.0"
fixed = { version = "1.31.0", features = ["serde"] }
